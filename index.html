<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#2a2108 0,#0b0b0b 55%);color:#eee;font-family:Barlow,-apple-system,Arial,sans-serif;padding:calc(28px + env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;align-items:center}
.logo{width:130px;height:auto;border-radius:22px;background:#fff;padding:8px;box-shadow:0 10px 40px rgba(245,168,0,.18)}
h1{font-family:"Bebas Neue",sans-serif;font-size:42px;letter-spacing:2px;margin-top:18px;text-align:center;line-height:1}
h1 em{color:#F5A800;font-style:normal}
.sub{color:#9a9a9a;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin:8px 0 30px;text-align:center}
.cards{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
a.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;background:#161616;border:1px solid #262626;border-radius:18px;padding:18px;position:relative;overflow:hidden;transition:transform .15s}
a.card:active{transform:scale(.98)}
a.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.badge{width:58px;height:58px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",sans-serif;font-size:24px;color:var(--fg);flex-shrink:0}
.t{font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:1.5px;line-height:1}
.d{color:#8d8d8d;font-size:13px;margin-top:4px}
.arr{margin-left:auto;color:#555;font-size:26px}
